spring:
  datasource:
    url: jdbc:sqlite:./data/icecream.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: none           # 改为 none，完全交给 Flyway
    show-sql: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    generate-ddl: false
    open-in-view: false

  flyway:
    enabled: true                      # 必须显式启用
    locations: classpath:db/migration  # 迁移脚本路径
    table: flyway_schema_history       # 版本记录表名
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8
    sql-migration-prefix: V
    sql-migration-suffix: .sql
    validate-on-migrate: true
  spring:
    web:
      resources:
        static-locations:
          - classpath:/static/
          - classpath:/public/
          - classpath:/resources/
          - classpath:/META-INF/resources/
        add-mappings: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

#  # 单次上传的单个文件最大大小
#  spring.servlet.multipart.max-file-size=20MB
#  # 单次请求中所有文件的总大小
#  spring.servlet.multipart.max-request-size=50MB

server:
  port: 8080
  servlet:
    context-path: /api